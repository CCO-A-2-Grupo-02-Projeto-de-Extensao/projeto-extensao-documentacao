apiVersion: 1

datasources:
  - name: Arandu MySQL
    uid: arandu-mysql
    type: mysql
    url: ${ARANDU_DB_HOST}
    user: grafana_leitura
    isDefault: true
    jsonData:
      database: ${ARANDU_DB_NAME}
      timezone: "-03:00"
      maxOpenConns: 10
    secureJsonData:
      password: ${ARANDU_DB_PASSWORD}
    editable: false
