services:
  dados:
    build:
      context: ..
      dockerfile: grafana/Dockerfile.dados
    container_name: arandu-grafana-dados
    network_mode: host
    environment:
      ARANDU_DB_ROOT_PASSWORD: ${ARANDU_DB_ROOT_PASSWORD:-7425}
      ARANDU_DEMO: ${ARANDU_DEMO:-1}
      TZ: America/Sao_Paulo
    volumes:
      - ../dados-externos:/dados-externos:ro
    restart: "no"

  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    container_name: arandu-grafana
    network_mode: host
    depends_on:
      dados:
        condition: service_completed_successfully
    environment:
      GF_SERVER_HTTP_PORT: "3001"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      ARANDU_DB_HOST: 127.0.0.1:3306
      ARANDU_DB_NAME: clube_tamoios
      ARANDU_DB_PASSWORD: grafana_leitura
    restart: unless-stopped
